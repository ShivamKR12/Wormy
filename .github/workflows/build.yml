name: Build Desktop Executables

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**.spec'
      - '**.ini'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame-ce
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build with PyInstaller
        run: |
          if [ -f main.py ]; then ENTRY="main.py"; else ENTRY=$(ls *.py | head -n 1); fi
          pyinstaller --clean --noconfirm --onefile $ENTRY
        shell: bash

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/*.exe -DestinationPath build-windows.zip

      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -czf build-linux.tar.gz -C dist .

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: zip -r build-macos.zip dist/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: |
            build-windows.zip
            build-linux.tar.gz
            build-macos.zip

  release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            artifacts/build-Windows/build-windows.zip
            artifacts/build-Linux/build-linux.tar.gz
            artifacts/build-macOS/build-macos.zip

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v1

      - name: Publish Windows to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_win
          cp artifacts/build-Windows/build-windows.zip push_win/
          butler push push_win ShivamKR12/wormy:windows --userversion desktop-v1.0.${{ github.run_number }}

      - name: Publish Linux to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_linux
          cp artifacts/build-Linux/build-linux.tar.gz push_linux/
          butler push push_linux ShivamKR12/wormy:linux --userversion desktop-v1.0.${{ github.run_number }}

      - name: Publish macOS to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_mac
          cp artifacts/build-macOS/build-macos.zip push_mac/
          butler push push_mac ShivamKR12/wormy:mac --userversion desktop-v1.0.${{ github.run_number }}
